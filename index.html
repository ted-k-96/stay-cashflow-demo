<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>더미 스테이 PMS · 현금흐름·정산 확인서 (더미 데이터)</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1f2430; --sub:#8a919e; --line:#eceef2; --line2:#e2e5ea;
  --blue:#1f63d6; --blue-soft:#e7f0ff; --blue-ink:#3b82f6; --green:#1e9e5a; --green-soft:#e4f6ec;
  --red:#d6453d; --orange:#e08a1e; --orange-soft:#fdf0dc; --bar:#4a9be0; --rail:#f3f4f7;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:12px;font-weight:400;line-height:1.45;letter-spacing:-0.1px}
.app{display:grid;grid-template-columns:54px 192px minmax(0,1fr);height:100vh;min-width:1100px}
/* 왼쪽 레일 */
.rail{background:var(--rail);border-right:1px solid var(--line);overflow:hidden;padding-top:14px;display:flex;flex-direction:column;align-items:stretch}
.rail .it{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7d8492;font-size:8.5px;text-align:center;line-height:1.15;padding:0 2px}
.rail .it svg{width:17px;height:17px}
.rail .it.on{color:var(--blue);background:var(--blue-soft);border-radius:8px;margin:0 4px}
/* 서브 패널 */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.side .prop{margin:12px 12px 8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;background:#fbfcff}
.side .prop .av{width:20px;height:20px;border-radius:6px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:10px}
.side .prop .nm{flex:1;text-align:center}
.side .grp{padding:14px 18px 4px;font-size:9.5px;color:var(--sub)}
.side .mi{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:11.5px;color:#3a4150}
.side .mi svg{width:15px;height:15px;color:#6f7686}
.side .sp{flex:1}
.side .user{border-top:1px solid var(--line);padding:12px 14px}
.side .user .u1{display:flex;align-items:center;gap:8px}
.side .user .av{width:22px;height:22px;border-radius:50%;background:#eceff4;color:#6b7383;display:flex;align-items:center;justify-content:center;font-size:10px}
.side .user .t{flex:1;font-size:10.5px;font-weight:600}.side .user .t span{display:block;font-weight:400;color:var(--sub);font-size:9px}
.side .user .u2{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:10px;color:#6f7686}
.side .user svg{width:13px;height:13px}
/* 메인 */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:40px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none}
.top .bd{font-size:10.5px;color:var(--sub)}
.badge-open{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:10px;background:var(--green-soft);color:var(--green);font-size:9px;font-weight:600}
.btn{font:inherit;font-size:11px;border-radius:8px;padding:6px 12px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:default;display:inline-flex;align-items:center;gap:6px}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn svg{width:13px;height:13px}
.tabs{height:34px;background:#fbfbfc;border-bottom:1px solid var(--line);display:flex;align-items:stretch;flex:none;padding:0 10px;overflow:hidden}
.tab{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 8px;font-size:10px;color:#868d9b;border-bottom:2px solid transparent;cursor:default;white-space:nowrap}
.tab span.t{overflow:hidden;text-overflow:ellipsis}
.tab .x{font-size:10px;color:#b3b8c2}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--blue);background:#fff}
.tab.link{cursor:pointer}
/* 눌러볼 수 있는 탭만 강조 (나머지는 더미 화면) */
.tab.link:not(.on){color:var(--blue);background:#f3f8ff;outline:1.5px dashed var(--blue-ink);outline-offset:-5px;border-radius:8px;font-weight:600}
.tab.link:not(.on):hover{background:var(--blue-soft)}
.tab.link.on{box-shadow:inset 0 -2px 0 var(--blue)}
.hint{display:inline-flex;align-items:center;gap:8px;font-size:10px;color:#6f7686;margin-right:14px}
.hint i{display:inline-block;width:22px;height:12px;border:1.5px dashed var(--blue-ink);border-radius:4px;background:#f3f8ff}
.scroll{flex:1;overflow:auto;padding:26px 24px 18px}
.page{max-width:1000px;margin:0 auto}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-0.3px}
.hello .sub{font-size:10.5px;color:var(--sub);margin-top:4px}
.hello .acts{display:flex;gap:8px}
.search{margin:22px 0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;height:46px;display:flex;align-items:center;padding:0 16px;gap:10px;color:#9aa1ae;font-size:12px}
.search svg{width:15px;height:15px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:372px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.card .hd .ti{font-size:11.5px;font-weight:700;white-space:nowrap}
.card .hd .ti small{font-weight:400;color:#6f7686;margin-left:6px;font-size:11px}
.card .hd .rt{display:flex;align-items:center;gap:8px;font-size:9.5px;color:#6f7686;white-space:nowrap}
.chip{background:#f1f2f5;color:#8a919e;border-radius:10px;padding:1px 7px;font-size:9px}
.pill{border-radius:10px;padding:1px 7px;font-size:9px;font-weight:600}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)}.pill.orange{background:var(--orange-soft);color:var(--orange)}
.seg{display:flex;gap:6px;font-size:9.5px;color:#6f7686}.seg b{font-weight:400;padding:1px 7px;border-radius:10px}.seg b.on{background:var(--blue-soft);color:var(--blue-ink)}
.list{overflow:auto;flex:1;scrollbar-width:thin}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #f3f4f6}
.row .nm{font-size:11px;color:var(--ink)}.row .nm b{font-weight:600}
.row .sb{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:9.5px;color:#7b8291}
.ch{width:13px;height:13px;border-radius:50%;color:#fff;font-style:normal;font-size:7.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.row .r{text-align:right;flex:none}.row .bd{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);border-radius:5px;padding:1px 6px;font-size:8.5px}
.row .tm{display:block;margin-top:5px;font-size:8.5px;color:#a0a6b2}
.empty{padding:22px 14px;color:#a0a6b2;font-size:10.5px}
.body{padding:10px 12px;overflow:auto;flex:1}
.nbox{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:10.5px}
.nbox .h{display:flex;justify-content:space-between;font-weight:700;font-size:11px}.nbox .h span{font-weight:400;color:#8a919e;font-size:9.5px}
.nbox p{margin:5px 0;color:#4a5160;font-size:10px}.nbox .m{font-size:8.5px;color:#a0a6b2}
.tags{display:flex;gap:5px;align-items:center;margin:7px 0 8px;font-size:8.5px;color:#6f7686}
.tag{background:var(--green-soft);color:var(--green);border-radius:8px;padding:1px 6px}
.fld{display:flex;gap:6px}.fld .in{flex:1;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:9.5px;color:#a0a6b2;background:#fff}
.fld .b{border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:9.5px;background:#fff;color:#444}
.fld .b.blue{background:#9ec0f3;border-color:#9ec0f3;color:#fff}
.chk{display:flex;gap:8px;align-items:flex-start}.chk i{width:12px;height:12px;border:1px solid #b8bec9;border-radius:3px;margin-top:1px;flex:none}
.lbl{font-size:9px;color:#8a919e;margin:12px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:104px}
.kpi .l{font-size:10px;color:#6f7686}.kpi .v{font-size:25px;font-weight:700;margin:8px 0 6px;letter-spacing:-0.4px}.kpi .d{font-size:9px;color:#9aa1ae}
.bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.pad{padding:14px 16px}
.pad .ti{font-size:11px;font-weight:700}.pad .ti small{font-weight:400;color:#9aa1ae;font-size:9.5px;margin-left:4px}
.bar svg{width:100%;height:auto;display:block;margin-top:10px}
.donut{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.donut svg{width:128px;height:128px}.donut .c{font-size:9.5px;color:#9aa1ae;margin-top:8px}
.span2{grid-column:span 2}
.foot{max-width:1000px;margin:18px auto 0;font-size:9.5px;color:#a0a6b2;text-align:center}
.scroll::-webkit-scrollbar,.list::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:#d5d8de;border-radius:4px}
.sumbar{background:#eaf2ff;border:1px solid #d3e3fb;color:#1f4fa8;border-radius:10px;padding:13px 16px;font-size:12.5px;font-weight:600;margin:18px 0 10px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k4 .kpi{min-height:128px;padding:14px 14px}
.kpis.k4 .v{font-size:22px}
.kpi .ev{font-size:8.5px;color:#a0a6b2;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.lg{display:flex;align-items:center;gap:6px;font-size:9px;color:#6f7686;margin-top:6px}
.lg .sq{width:8px;height:8px;border-radius:2px;display:inline-block}.lg .ln{width:14px;height:2px;background:#3b8fd9;display:inline-block;margin-left:6px}
.row .amt{font-size:11px;font-weight:600}
.row .nm .ch{margin-right:4px;vertical-align:-2px}
.cals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:12px 14px 14px}
.calt{font-size:11px;font-weight:700;margin-bottom:6px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.25fr);gap:2px}
.calh{font-size:9px;color:#8a919e;text-align:center;padding:2px 0}
.cd{border:1px solid var(--line);border-radius:4px;min-height:50px;padding:2px 3px;font-size:9px;min-width:0;background:#fff}
.cd b{font-size:9.5px;font-weight:600}
.cd.we{background:#f1f2f5}.cd.ho{background:#fbe5e1}.cd.out{background:transparent;border-color:transparent}
.cd.asof{outline:2px solid var(--blue);outline-offset:-2px}
.gi{color:#1e8449;text-align:right}.ro{color:#c0392b;text-align:right}
.cw{border:1px solid var(--line);border-radius:4px;padding:2px 3px;font-size:9px;background:#fff;min-width:0}
.cw .nt{text-align:right;font-weight:700;color:var(--ink)}
.callg{font-size:9.5px;color:#6f7686;margin-top:6px}.callg .gi,.callg .ro{display:inline}
table.tb{width:100%;border-collapse:collapse}
table.tb th,table.tb td{padding:8px 14px;border-bottom:1px solid #f3f4f6;font-size:10.5px;text-align:left;font-weight:400}
table.tb th{color:#8a919e;font-size:9.5px;background:#fafbfc}
table.tb .n{text-align:right}
table.tb tr.tt td{font-weight:700;background:#fafbfc}
.tb.rl td,.tb.rl th{vertical-align:top;font-size:9.5px;padding:7px 10px}
.tb.rl tr.as td{background:#fff8dc}
.cf{border-radius:8px;padding:1px 7px;font-size:8.5px;font-weight:600;background:#eef0f3;color:#6f7686}
.cf.verified{background:var(--green-soft);color:var(--green)}.cf.sourced{background:var(--blue-soft);color:var(--blue-ink)}.cf.assumed{background:#ffecb3;color:#9a6700}
.sched .row{height:48px;padding-top:0;padding-bottom:0}
.sched .list{flex:none;max-height:288px;overflow-y:auto;scrollbar-width:auto;scrollbar-color:auto}
.sched .list::-webkit-scrollbar{width:8px}.sched .list::-webkit-scrollbar-track{background:#f1f2f5}.sched .list::-webkit-scrollbar-thumb{background:#b9bec8;border-radius:4px}
.fs table.tb td,.fs table.tb th{font-variant-numeric:tabular-nums}
.fs tr.sec td{background:#f4f6fa;font-weight:700;font-size:10.5px;color:#2b3345;border-top:1px solid var(--line2)}
.fs tr.li td:first-child{padding-left:30px;color:#3a4152}
.fs tr.sub td{font-weight:700;border-top:1px solid #9aa1ae;background:#fff}
.fs tr.net td{background:#f9fafc}
.fs tr.bal td{color:#5b6372}
.fs tr.bal td:first-child{padding-left:14px}
.fs tr.fin td{border-top:1px solid #9aa1ae;border-bottom:3px double #2b3345;background:#f4f8ff;color:var(--blue)}
.fs .fsn{padding:8px 14px 12px;font-size:9.5px;color:#8a919e}

.seg2{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.seg2 button{font:inherit;font-size:11.5px;padding:7px 15px;border-radius:18px;border:1px solid var(--line2);background:#fff;color:#4a5160;cursor:pointer}
.seg2 button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.lnk{display:inline-block;margin-top:8px;font-size:9.5px;color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-family:inherit}
.kpi .tm2{font-size:9px;color:#9aa1ae;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.chips button{font:inherit;font-size:10.5px;padding:4px 11px;border-radius:14px;border:1px solid var(--line2);background:#fff;color:#4a5160;cursor:pointer}
.chips button.on{background:var(--blue-soft);border-color:var(--blue-ink);color:var(--blue);font-weight:600}
.chips button small{color:#9aa1ae;margin-left:4px;font-size:9px}
table.jt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.jt th{font-size:9.5px;color:#8a919e;background:#fafbfc;padding:7px 10px;text-align:left;font-weight:400;border-bottom:1px solid var(--line)}
table.jt td{padding:5px 10px;font-size:10.5px;vertical-align:top}
table.jt tr.f td{border-top:1px solid var(--line2);padding-top:9px}
table.jt tr.f td.hd1{font-weight:600}
table.jt .n{text-align:right;white-space:nowrap}
table.jt .ac{color:#3a4152}table.jt .ac small{color:#9aa1ae;margin-left:5px}
table.jt .cr{padding-left:30px}
table.jt .meta{color:#7b8291;font-size:9.5px}
table.jt tr.tot td{font-weight:700;background:#f4f8ff;border-top:1px solid #9aa1ae}
.st{border-radius:8px;padding:1px 7px;font-size:8.5px;font-weight:600}
.st.done{background:var(--green-soft);color:var(--green)}.st.plan{background:#eef0f3;color:#6f7686}
.kd{border-radius:8px;padding:1px 7px;font-size:8.5px;font-weight:600;background:var(--blue-soft);color:var(--blue-ink);margin-right:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.ex{padding:14px 16px;font-size:10.5px;color:#3a4152}.ex p{margin:6px 0}.ex b{font-weight:700}
.nts{padding:10px 14px 12px;font-size:9.5px;color:#8a919e}.nts div{margin-top:3px}
.morebtn{display:block;margin:10px auto 14px;font:inherit;font-size:10.5px;padding:6px 16px;border:1px solid var(--line2);border-radius:14px;background:#fff;cursor:pointer;color:var(--blue)}

.inp{font:inherit;font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:4px 7px;width:120px;text-align:right;background:#fff;color:var(--ink)}
.inp.sm{width:70px}.inp.ed{border-color:var(--orange);background:var(--orange-soft)}
.modf{display:inline-flex;gap:8px;align-items:center;font-size:10px;color:var(--orange);margin-right:12px;font-weight:600}
.frm{padding:12px 16px;display:flex;gap:10px;align-items:center;font-size:10.5px;color:#3a4152;flex-wrap:wrap}
.frm label{display:flex;gap:8px;align-items:center}
.sub2{padding:10px 16px 0;font-size:10.5px;font-weight:700;color:#2b3345}

.erpbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1f63d6;color:#fff;border-radius:8px 8px 0 0;padding:9px 14px;margin-top:14px}
.erpbar .tt{font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px}
.erpbar .tip{font-size:9.5px;font-weight:600;background:#fff;color:#1f63d6;border-radius:10px;padding:2px 8px}
.erpbar .bt{display:flex;gap:6px}.erpbar button{font:inherit;font-size:10px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:5px 9px;cursor:pointer}
.erpmsg{background:#fff8dc;border:1px solid #f0e2a6;color:#6b5a14;font-size:10.5px;padding:8px 14px}

.erpq{background:#fff;border:1px solid var(--line);border-top:0;padding:10px 14px}
.erpq .r1{display:flex;align-items:center;gap:10px}

.erpq .cash{display:inline-flex;align-items:center;gap:8px;font-size:10.5px}.erpq .cash b{background:#3a3f4b;color:#fff;border-radius:3px;padding:5px 9px;font-weight:600}.erpq .cash u{color:#1f2430}
.erpq .grow{flex:1}
.erpq .go{font:inherit;font-size:10.5px;background:#3a3f4b;color:#fff;border:0;border-radius:4px;padding:6px 16px;cursor:pointer}
.erpq .adv{font:inherit;font-size:11px;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:5px 9px;cursor:pointer;margin-left:6px}

.erpwrap{display:flex;gap:10px;align-items:flex-start;margin-top:0}
.erpmain{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
#erpgrid{max-height:460px;overflow-y:scroll;overflow-x:auto}
table.eg{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums;min-width:820px}
table.eg th{position:sticky;top:0;z-index:1;background:#f1f2f5;color:#4a5160;font-weight:600;font-size:10px;border:1px solid #dfe2e8;padding:7px 6px;text-align:center}
table.eg td{border:1px solid #e6e8ed;padding:0 8px;height:30px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

table.eg td.dc{text-align:center;color:#1a5fd0;font-weight:600}

<div class="app">
  <nav class="rail" id="rail"></nav>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div class="tabs" id="tabs"></div>

<script>/* 브라우저 계산 엔진 (v2.4)
 * 파이썬 정산·비용·전표·손익 계산(settle.py, costs.py, overview.py, accounting.py, views.py)을 같은 순서로 옮긴 것이다.
 * 입력: Python이 만든 inputs(예약·규칙·비용·공휴일·설정·상수). 편집값(ov)만 덮어써서 전체를 다시 계산한다.
 * 파이썬 결과와 같은 숫자가 나오는지는 tests/test_engine_parity.py가 확인한다. 세금은 계산하지 않는다.
 * 숫자는 모두 더미 데이터이며 일부 규칙은 가정이다.
 */
(function (root) {
"use strict";

/* ---------- 날짜·반올림 (파이썬과 같은 방식) ---------- */
function pad(n, w) { var s = String(n); while (s.length < w) s = "0" + s; return s; }
function iso(y, m, d) { return pad(y, 4) + "-" + pad(m, 2) + "-" + pad(d, 2); }
function parse(s) { var p = s.split("-"); return [+p[0], +p[1], +p[2]]; }
function toUTC(s) { var p = parse(s); return Date.UTC(p[0], p[1] - 1, p[2]); }
function fromUTC(t) { var d = new Date(t); return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
function addDays(s, n) { return fromUTC(toUTC(s) + n * 86400000); }
function weekday(s) { return (new Date(toUTC(s)).getUTCDay() + 6) % 7; }   // 월=0 … 일=6
function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function mk(s) { return s.slice(0, 7); }
function mend(key) { var y = +key.slice(0, 4), m = +key.slice(5); return iso(y, m, dim(y, m)); }
function dayOf(key, n) { var y = +key.slice(0, 4), m = +key.slice(5); return iso(y, m, Math.min(n, dim(y, m))); }
function nextMonthKey(key) { var y = +key.slice(0, 4), m = +key.slice(5); return m === 12 ? pad(y + 1, 4) + "-01" : pad(y, 4) + "-" + pad(m + 1, 2); }
function pyRound(x) {                       // 파이썬 round(): 0.5는 짝수 쪽
  var f = Math.floor(x), d = x - f;
  if (d < 0.5) return f;
  if (d > 0.5) return f + 1;
  return f % 2 === 0 ? f : f + 1;
}
function sum(arr, fn) { var t = 0; for (var i = 0; i < arr.length; i++) t += fn ? fn(arr[i]) : arr[i]; return t; }
function formatMan(won) { return pyRound(won / 10000).toLocaleString("en-US") + "만 원"; }
function cmpStr(a, b) { return a < b ? -1 : a > b ? 1 : 0; }

/* ---------- 영업일 ---------- */
function makeCal(holidays) {
  var hol = {}; holidays.forEach(function (h) { hol[h] = true; });
  var isBiz = function (d) { return weekday(d) < 5 && !hol[d]; };
  return {
    hol: hol, isBiz: isBiz,
    nextBiz: function (d) { while (!isBiz(d)) d = addDays(d, 1); return d; },
    addBiz: function (d, n) { var cur = d, left = n; while (left > 0) { cur = addDays(cur, 1); if (isBiz(cur)) left--; } return cur; }
  };
}

/* ---------- 정산 (settle.py) ---------- */
function calcCommission(ch, gross, refund) {
  var rateInt = Math.round(ch.commission.rate * 1e6);
  var base = ch.cancellation.fee_refund_on_cancel ? gross - refund : gross;
  var fee = Math.floor((rateInt * base + 500000) / 1e6);
  return Math.max(0, Math.min(fee, gross - refund));
}
function stayNights(r) { var out = []; for (var i = 0; i < r.nights; i++) out.push(addDays(r.checkin, i)); return out; }
function allocRevenue(r) {
  var amount = r.gross - r.refund, out = {};
  if (amount === 0) return out;
  var per = Math.floor(amount / r.nights);
  stayNights(r).forEach(function (night, i) {
    var v = i < r.nights - 1 ? per : amount - per * (r.nights - 1), k = mk(night);
    out[k] = (out[k] || 0) + v;
  });
  return out;
}
function anchorDate(anchor, r) {
  if (anchor === "checkin") return r.checkin;
  if (anchor === "checkout" || anchor === "stay_complete") return r.checkout;
  throw new Error("platform 입금에 쓸 수 없는 anchor: " + anchor);
}
function invoiceDates(bl, checkout, cal) {
  var p = parse(checkout), y = p[0], m = p[1];
  if (m === 12) { y++; m = 1; } else m++;
  var day = Math.min(bl.invoice_issue_day_of_next_month, dim(y, m));
  var issue = iso(y, m, day), due = addDays(issue, bl.payment_due_days_after_invoice);
  return [issue, cal.nextBiz(due)];
}
function settleReservation(r, channels, cal) {
  var ch = channels[r.channel], kept = r.gross - r.refund, commission = calcCommission(ch, r.gross, r.refund);
  var s = { reservation_id: r.id, channel: r.channel, collect_mode: r.collect_mode, status: r.status, gross: r.gross, refund: r.refund,
            revenue_by_month: allocRevenue(r), commission: commission, net_expected: 0, cash_in_date: null,
            commission_cash_out_date: null, checkin: r.checkin, checkout: r.checkout };
  if (r.collect_mode === "platform") {
    var pr = ch.payout.platform;
    s.net_expected = kept - commission;
    if (kept > 0) s.cash_in_date = cal.addBiz(anchorDate(pr.anchor, r), pr.lag_business_days);
  } else {
    var bl = ch.payout.property;
    s.net_expected = kept;
    if (kept > 0) s.cash_in_date = r.checkout;
    if (commission > 0) s.commission_cash_out_date = invoiceDates(bl, r.checkout, cal)[1];
  }
  return s;
}
function cashEvents(settled) {
  var ev = [];
  settled.forEach(function (s) {
    if (s.cash_in_date && s.net_expected > 0)
      ev.push({ date: s.cash_in_date, kind: s.collect_mode === "platform" ? "입금(플랫폼 정산)" : "현장 수령", channel: s.channel, reservation_id: s.reservation_id, amount: s.net_expected });
    if (s.commission_cash_out_date && s.commission > 0)
      ev.push({ date: s.commission_cash_out_date, kind: "수수료 납부(월 청구서)", channel: s.channel, reservation_id: s.reservation_id, amount: -s.commission });
  });
  ev.sort(function (a, b) { return cmpStr(a.date, b.date) || cmpStr(a.reservation_id, b.reservation_id); });
  return ev;
}

/* ---------- 비용 (costs.py) ---------- */
function payDate(rule, key, usage) {
  if (rule === "none") return null;
  if (rule === "month_end") return mend(key);
  if (rule.indexOf("day_") === 0) return dayOf(usage ? nextMonthKey(key) : key, parseInt(rule.split("_")[1], 10));
  return null;
}
function costEvents(reservations, settled, months, cfg) {
  var ev = [], confirmed = reservations.filter(function (r) { return r.status === "confirmed"; });
  var nights = {}, checkouts = {}, resCnt = {};
  confirmed.forEach(function (r) {
    stayNights(r).forEach(function (n) { nights[mk(n)] = (nights[mk(n)] || 0) + 1; });
    checkouts[mk(r.checkout)] = (checkouts[mk(r.checkout)] || 0) + 1;
    resCnt[mk(r.checkin)] = (resCnt[mk(r.checkin)] || 0) + 1;
  });
  Object.keys(cfg.categories).forEach(function (cat) {
    cfg.categories[cat].forEach(function (it) {
      var drv = it.driver, amt = it.amount, rule = it.pay_rule || "none";
      if (drv === "pct_of_revenue") {
        if (it.applies_to === "property_collect_only" && rule === "deducted_from_deposit") {
          settled.forEach(function (s) {
            if (s.collect_mode === "property" && s.cash_in_date && s.net_expected > 0)
              ev.push({ name: it.name, category: cat, month: mk(s.cash_in_date), amount: pyRound(s.net_expected * amt), pay_date: s.cash_in_date });
          });
        }
        return;
      }
      months.forEach(function (k) {
        var usage = drv === "per_night" || drv === "per_checkout" || drv === "per_reservation", qty;
        if (drv === "per_month") qty = 1;
        else if (drv === "per_night") qty = nights[k] || 0;
        else if (drv === "per_checkout") qty = checkouts[k] || 0;
        else if (drv === "per_reservation") qty = resCnt[k] || 0;
        else throw new Error("알 수 없는 driver: " + drv);
        if (qty === 0) return;
        var pay = it.depreciation ? null : payDate(rule, k, usage);
        ev.push({ name: it.name, category: cat, month: k, amount: pyRound(amt * qty), pay_date: pay });
      });
    });
  });
  return ev;
}

/* ---------- 이번 달 한눈에 (overview.py) ---------- */
function weekCount(y, m) { return Math.floor((dim(y, m) + 6) / 7); }
function weekIndex(d) { var p = parse(d); return Math.min(Math.floor((p[2] - 1) / 7), weekCount(p[0], p[1]) - 1); }
function weekLabel(y, m, idx) {
  var last = dim(y, m), start = idx * 7 + 1, end = idx === weekCount(y, m) - 1 ? last : start + 6;
  return (idx + 1) + "주차 (" + m + "/" + start + "~" + m + "/" + end + ")";
}
function flowItems(data, C) {
  var items = [], dayIn = {}, label = {};
  C.cost_rows.forEach(function (r) { label[r[1]] = r[0]; });
  data.events.forEach(function (e) {
    if (e.amount > 0) {
      var lab = e.kind.indexOf("입금") === 0 ? C.label_in[0] : C.label_in[1];
      items.push({ date: e.date, side: "in", label: lab, amount: e.amount });
      dayIn[e.date] = (dayIn[e.date] || 0) + e.amount;
    } else items.push({ date: e.date, side: "out", label: C.label_fee, amount: -e.amount });
  });
  data.cost_events.forEach(function (c) {
    if (!c.pay_date) return;
    if (C.excluded_categories.indexOf(c.category) >= 0) return;
    if (!label[c.category]) throw new Error("알 수 없는 비용 category: " + c.category);
    items.push({ date: c.pay_date, side: "out", label: label[c.category], amount: c.amount });
  });
  if (data.reserve_rate) {
    Object.keys(dayIn).sort().forEach(function (d) {
      var r = pyRound(Math.max(dayIn[d], 0) * data.reserve_rate);
      if (r) items.push({ date: d, side: "out", label: C.label_reserve, amount: r });
    });
  }
  return items;
}
function buildOverview(data, st, C) {
  var month = st.month, asOf = st.as_of, p = month.split("-"), year = +p[0], mon = +p[1];
  var opening = st.opening, loan = st.loan_limit || 0, rate = data.reserve_rate;
  var items = flowItems(data, C).filter(function (it) { return mk(it.date) === month; });
  function tri(label, side) {
    var sel = items.filter(function (it) { return it.side === side && it.label === label; });
    var before = sum(sel.filter(function (it) { return it.date <= asOf; }), function (it) { return it.amount; });
    var after = sum(sel.filter(function (it) { return it.date > asOf; }), function (it) { return it.amount; });
    return [label, before, after, before + after];
  }
  var rowsIn = C.label_in.map(function (l) { return tri(l, "in"); });
  var rowsOut = C.out_order.map(function (l) { return tri(l, "out"); });
  var col = function (rows) { return [1, 2, 3].map(function (i) { return sum(rows, function (r) { return r[i]; }); }); };
  var inTotal = col(rowsIn), outTotal = col(rowsOut), net = [0, 1, 2].map(function (i) { return inTotal[i] - outTotal[i]; });
  var feeRow = rowsOut.filter(function (r) { return r[0] === C.label_fee; })[0];
  var n = weekCount(year, mon), wIn = [], wOut = [], i;
  for (i = 0; i < n; i++) { wIn.push(0); wOut.push(0); }
  items.forEach(function (it) { (it.side === "in" ? wIn : wOut)[weekIndex(it.date)] += it.amount; });
  var weeks = [], cum = opening;
  for (i = 0; i < n; i++) {
    cum += wIn[i] - wOut[i];
    weeks.push({ label: weekLabel(year, mon, i), inflow: wIn[i], outflow: wOut[i], net: wIn[i] - wOut[i], balance: cum });
  }
  var balanceEnd = opening + net[2];
  return { month: month, as_of: asOf, opening: opening, loan_limit: loan, reserve_rate: rate,
    rows_in: rowsIn, in_total: inTotal, rows_out: rowsOut, out_total: outTotal, net: net,
    balance_asof: opening + net[0], balance_end: balanceEnd,
    off_asof: opening + inTotal[0] - feeRow[1], off_end: opening + inTotal[2] - feeRow[3], weeks: weeks,
    headline: mon + "월 월말 예상 잔고 " + formatMan(balanceEnd) + " (들어올 돈 " + formatMan(inTotal[2]) + ", 나갈 돈 " + formatMan(outTotal[2]) + ")" };
}
function buildCalendar(items, year, month, asOf, hol) {
  var byDay = {};
  items.forEach(function (it) { var v = byDay[it.date] || (byDay[it.date] = [0, 0]); v[it.side === "in" ? 0 : 1] += it.amount; });
  var first = iso(year, month, 1), lead = new Date(toUTC(first)).getUTCDay();   // 일요일 시작
  var lastDay = iso(year, month, dim(year, month)), weeks = [], totIn = 0, totOut = 0, cur = addDays(first, -lead);
  while (true) {
    var days = [], wIn = 0, wOut = 0;
    for (var k = 0; k < 7; k++) {
      var d = cur, inMonth = +d.slice(5, 7) === month && +d.slice(0, 4) === year;

  var Y=function(v){return t+(H-t-b)*(1-(v-lo)/span);},slot=(W-l-r)/n;

    '<div class="invp"><div><span>공급자 (채널)</span><b>'+esc(m.c.display_name)+' (가상 상호)</b><i>등록번호 000-00-00000 · 홍길동(예시)</i></div><div><span>공급받는 자 (숙소)</span><b>더미 스테이</b><i>등록번호 000-00-00001 · 김하루(예시)</i></div></div>'+
    '<div class="invd"><div>작성일자<b>'+esc(m.issue)+'<span class="ast">*</span></b></div><div>공급가액<b>'+won(sup)+'원<span class="ast">*</span></b></div><div>세액<b>'+won(vt)+'원<span class="ast">*</span></b></div><div class="k">합계금액<b>'+won(tot)+'원</b></div></div>'+
    '<div class="sq2">비고: '+Number(m.month.slice(5))+'월 체크아웃 예약 '+m.rows.length+'건 · 수수료율 '+rt+'</div>'+
    '<table class="tb"><thead><tr><th>월</th><th>일</th><th>품목</th><th>규격</th><th class="n">수량</th><th class="n">단가</th><th class="n">공급가액</th><th class="n">세액</th><th class="n">비고(수수료)</th></tr></thead><tbody>'+tr+
    '<tr class="gs"><td colspan="6">합계</td><td class="n">'+won(sup)+'</td><td class="n">'+won(vt)+'</td><td></td></tr></tbody></table>'+
    '<div class="sum"><div>합계금액<b>'+won(tot)+'원</b></div><div>정산에서 이미 뺀 금액<small>채널 결제 '+m.np+'건</small><b>'+won(m.gp.fee)+'원</b></div><div class="k">따로 낼 금액<small>현장 결제 '+m.nq+'건</small><b>'+won(m.gq.fee)+'원</b></div></div>'+
    '<div class="note">품목은 결제 방식별 행으로 나눴고, 줄마다 수수료를 VAT 포함 금액으로 보고 10%로 나눈 임의 가정입니다<span class="ast">*</span>. 실제 발행은 홈택스에서 하며, 발행 주체와 금액 기준은 채널·계약마다 다릅니다.</div></div></div>';
}

function hRefresh(toHist){
  var sc=document.querySelector('.scroll'),top=sc.scrollTop;
  document.getElementById('page').innerHTML=PAGES.cash();sc.scrollTop=top;
  if(toHist){var el=document.getElementById('hist');if(el)sc.scrollTop=el.offsetTop-12;}
}
document.getElementById('page').addEventListener('click',function(ev){
  if(current!=='cash') return;
  var xt=ev.target.closest?ev.target.closest('[data-xlsx]'):null;if(xt){xlsxSave();return;}
  var pt=ev.target.closest?ev.target.closest('[data-print]'):null;if(pt){var pc=pt.getAttribute('data-print')==='inv'?'pinv':'pstmt';document.body.classList.add(pc);window.print();setTimeout(function(){document.body.classList.remove(pc);},300);return;}
  var t=ev.target.closest?ev.target.closest('[data-day],[data-h]'):null;if(!t) return;
  if(t.hasAttribute('data-day')){var d=t.getAttribute('data-day');H.day=H.day===d?'':d;hRefresh(true);return;}
  var k=t.getAttribute('data-h');H[k]=t.getAttribute('data-v');hRefresh(false);
});
function chip(c){return c?'<span class="cf '+esc(c)+'">'+esc(c)+'</span>':'';}
function conf(ck,item){var c='';RULES0.forEach(function(r){if(r.channel_key===ck&&r.item===item)c=r.confidence;});return c;}

function normA(a){return a==='stay_complete'?'checkout':a;}
function issueDef(k){var p=INP.channels[k].payout.property;return p?p.invoice_issue_day_of_next_month:5;}
function star(on){return on?'<span class="ast" title="임의로 정한 예시 값">*</span>':'';}
var STAR={rate:{airbnb:1,naver:1,booking:1,yanolja:1},anchor:{booking:1,yanolja:1},lag:{naver:1,booking:1,yanolja:1},issue:{airbnb:1,naver:1,booking:1,yanolja:1}};
function rulesPage(){
  var A=D.accounting,h='<div class="page"><div class="hello"><div><h1>입금·정산 규칙</h1><div class="sub">값을 바꾸면 현금흐름과 정산 확인서가 바로 다시 계산됩니다 · 더미 값 · 이 브라우저에만 저장</div></div>'+
    '<div class="acts">'+(ovCount()?'<button type="button" class="btn" data-reset="1">기본값으로 되돌리기</button>':'')+'</div></div>';
  var op=OV.opening!==undefined?OV.opening:INP.settings.opening;
  h+='<div class="card" style="margin-top:14px"><div class="frm"><label>월초 시작 잔고(원) '+inpHtml('opening','opening',op,INP.settings.opening,'',10000)+'</label></div></div>';
  h+='<div class="card" style="margin-top:10px"><div class="hd"><div class="ti">채널별 입금·수수료 규칙<small><span class="ast">*</span> = 임의로 정한 예시 값</small></div></div>'+
     '<table class="tb rl"><thead><tr><th>채널</th><th>수납</th><th>수수료율</th><th>입금 기준일</th><th>입금 지연</th><th>수수료 청구</th><th>발행일</th><th>납부</th></tr></thead><tbody>';
  Object.keys(INP.channels).forEach(function(k){
    var c=INP.channels[k],base=c.commission.rate,cur=OV.commission&&OV.commission[k]!==undefined?OV.commission[k]:base,pl=c.payout.platform,pr=c.payout.property;
    var an=OV.anchor&&OV.anchor[k]!==undefined?OV.anchor[k]:normA(pl.anchor),lcur=OV.lag&&OV.lag[k]!==undefined?OV.lag[k]:pl.lag_business_days;
    var isu=OV.issue&&OV.issue[k]!==undefined?OV.issue[k]:issueDef(k);
    var sel='<select class="inp'+(an!==normA(pl.anchor)?' ed':'')+'" data-ov="anchor" data-key="'+esc(k)+'" aria-label="입금 기준일"><option value="checkin"'+(an==='checkin'?' selected':'')+'>체크인</option><option value="checkout"'+(an==='checkout'?' selected':'')+'>체크아웃</option></select>';
    h+='<tr><td>'+chDot(k)+' '+esc(c.display_name)+'</td><td>플랫폼 수납</td>'+
       '<td>'+inpHtml('commission',k,Math.round(cur*10000)/100,Math.round(base*10000)/100,'sm',0.1)+' %'+star(STAR.rate[k])+'</td>'+
       '<td>'+sel+star(STAR.anchor[k])+'</td>'+
       '<td>+'+inpHtml('lag',k,lcur,pl.lag_business_days,'sm',1)+' 영업일'+star(STAR.lag[k])+'</td>'+
       '<td>입금에서 차감</td>'+
       '<td>익월 '+inpHtml('issue',k,isu,issueDef(k),'sm',1)+' 일'+star(STAR.issue[k])+'</td><td>입금 시 차감</td></tr>';
    if(pr){
      var du=OV.due&&OV.due[k]!==undefined?OV.due[k]:pr.payment_due_days_after_invoice;
      h+='<tr><td></td><td>현장 수납</td><td>위와 같음</td><td>체크아웃</td><td>—</td><td>월 청구서</td><td>익월 '+isu+'일(위와 같음)</td>'+
         '<td>발행 후 '+inpHtml('due',k,du,pr.payment_due_days_after_invoice,'sm',1)+' 일</td></tr>';
    }
  });
  h+='</tbody></table><div class="lg2"><span class="ast">*</span> 확인하지 못해 임의로 둔 예시 값입니다. 취소 시 수수료 환불은 4개 채널 모두 가정입니다.<br>발행일은 정산 확인서의 날짜에 쓰입니다. 현금 일정이 바뀌는 건 월 청구서로 받는 부킹닷컴 현장 수납분뿐이고, 나머지는 입금에서 미리 차감됩니다. 공휴일은 KASI 달력자료 기준입니다.</div></div>';
  h+='<div class="card" style="margin-top:10px"><div class="hd"><div class="ti">고정비·변동비 지급<small>금액은 더미</small></div></div><table class="tb"><thead><tr><th>항목</th><th class="n">금액(원)</th><th>기준</th><th>지급일</th></tr></thead><tbody>';
  var i=0;
  Object.keys(INP.costs.categories).forEach(function(cat){INP.costs.categories[cat].forEach(function(it){
    var r=A.cost_settings[i++];
    var cell=it.driver==='pct_of_revenue'?esc(r.amount):inpHtml('cost',it.name,curCost(it.name),it.amount,'',1000);
    h+='<tr><td>'+esc(it.name)+'</td><td class="n">'+cell+'</td><td>'+esc(r.unit)+'</td><td>'+esc(r.pay)+'</td></tr>';
  });});
  h+='</tbody></table></div></div>';
  return h;
}

function costDefault(name){var v=null;Object.keys(INP.costs.categories).forEach(function(c){INP.costs.categories[c].forEach(function(it){if(it.name===name)v=it.amount;});});return v;}
function curCost(name){return OV.cost&&OV.cost[name]!==undefined?OV.cost[name]:costDefault(name);}
function inpHtml(kind,key,val,def,cls,step){
  return '<input type="number" class="inp '+(cls||'')+(Math.abs(val-def)>1e-9?' ed':'')+'" data-ov="'+kind+'" data-key="'+esc(key)+'" value="'+val+'" step="'+(step||1)+'" aria-label="'+esc(key)+'">';
}



/* 편집값 상태: 바꾼 값만 OV에 둔다(기본값과 같으면 지운다). 저장은 이 브라우저에만 한다. */
var INP=D.inputs,OTA=window.OtaEngine,KEY='ota_overrides_v1',RULES0=D.rules,LABELS0=D.labels,OV={};
function loadOV(){try{var t=window.localStorage.getItem(KEY);if(!t)return {};var o=JSON.parse(t);return o&&o.v===1&&o.ov&&typeof o.ov==='object'?o.ov:{};}catch(e){return {};}}
function saveOV(){try{if(ovCount())window.localStorage.setItem(KEY,JSON.stringify({v:1,ov:OV}));else window.localStorage.removeItem(KEY);}catch(e){}}
function ovCount(){return (OV.opening!==undefined?1:0)+Object.keys(OV.commission||{}).length+Object.keys(OV.lag||{}).length+Object.keys(OV.cost||{}).length+Object.keys(OV.anchor||{}).length+Object.keys(OV.issue||{}).length+Object.keys(OV.due||{}).length;}
function updateFlag(){var el=document.getElementById('modflag');if(!el)return;
  el.innerHTML=ovCount()?'<span class="modf">입력값 '+ovCount()+'개 변경 · 이 브라우저에만 저장 <button type="button" class="lnk" data-reset="1" style="margin:0">초기화</button></span>':'';}
function recompute(){
  var r=OTA.compute(INP,OV);
  D.overview=r.overview;D.weekly=r.weekly;D.calendar=r.calendar;D.upcoming=r.upcoming;D.accounting=r.accounting;
  var L={},k;for(k in LABELS0)L[k]=LABELS0[k];for(k in r.labels)L[k]=r.labels[k];D.labels=L;
  D.rules=r.rules_patch(RULES0);updateFlag();
}
function rerender(){var sc=document.querySelector('.scroll'),top=sc.scrollTop;document.getElementById('page').innerHTML=PAGES[current]();sc.scrollTop=top;}
function setOV(kind,key,val,def){
  if(kind==='opening'){if(val===def)delete OV.opening;else OV.opening=val;return;}
  var m=OV[kind]||(OV[kind]={});if(val===def||(typeof val==='number'&&Math.abs(val-def)<1e-9))delete m[key];else m[key]=val;
  if(!Object.keys(m).length)delete OV[kind];
}
function onEdit(el){
  var kind=el.getAttribute('data-ov'),key=el.getAttribute('data-key'),raw=parseFloat(el.value),val,def;
  if(kind==='anchor'){val=el.value;def=normA(INP.channels[key].payout.platform.anchor);setOV(kind,key,val,def);saveOV();recompute();setTimeout(rerender,0);return;}
  if(!isFinite(raw)){rerender();return;}
  if(kind==='opening'){val=Math.min(Math.max(Math.round(raw),0),10000000000);def=INP.settings.opening;}
  else if(kind==='commission'){val=Math.round(Math.min(Math.max(raw,0),100)*100)/10000;def=INP.channels[key].commission.rate;}
  else if(kind==='lag'){val=Math.min(Math.max(Math.round(raw),0),60);def=INP.channels[key].payout.platform.lag_business_days;}
  else if(kind==='cost'){val=Math.min(Math.max(Math.round(raw),0),100000000);def=costDefault(key);}
  else if(kind==='issue'){val=Math.min(Math.max(Math.round(raw),1),28);def=issueDef(key);}
  else if(kind==='due'){val=Math.min(Math.max(Math.round(raw),0),60);def=INP.channels[key].payout.property.payment_due_days_after_invoice;}
  else return;
  setOV(kind,key,val,def);saveOV();recompute();setTimeout(rerender,0);
}
function resetOV(){OV={};saveOV();recompute();rerender();}
document.addEventListener('click',function(ev){var t=ev.target.closest?ev.target.closest('[data-reset]'):null;if(t)resetOV();});
document.getElementById('page').addEventListener('change',function(ev){var t=ev.target;if(!t||!t.getAttribute)return;if(t.getAttribute('data-ov')){onEdit(t);return;}if(t.getAttribute('data-hf')==='ch'&&current==='cash'){H.ch=t.value;hRefresh(false);}if(t.getAttribute('data-sf')&&current==='cash'){S[t.getAttribute('data-sf')]=t.value;hRefresh(false);}});

var PAGES={dash:dashboard,cash:cashPage,rules:rulesPage};
function footer(){document.getElementById('foot').textContent=D.labels.footer;}
shell();OV=loadOV();if(ovCount())recompute();else updateFlag();footer();go('dash');
})();
</script>
